services:
  airflow:
    build: .
    container_name: smart-mobility-airflow

    command: standalone

    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ../data_pipeline:/opt/airflow/data_pipeline

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}